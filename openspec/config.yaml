schema: spec-driven

context: |
  Plan and implement through /opsx:propose, /opsx:apply, /opsx:update, /opsx:sync, /opsx:archive.
  Read AGENTS.md, docs/FRS.md, and docs/SDS.md before planning. Acceptance criteria are the FRS-<AREA>-<NNN> bullets.
  The approved OpenAPI contract wins over invented routes or status codes.
  Artifact rules live only in this file. Agent launch steps live only in .claude/commands/opsx/apply.md.

rules:
  proposal:
    - Use the sections Change, Why, Scope, Out of scope, FRS ids, and Open decisions.
    - Write each section in enough detail to implement and review the change, including the behavior, the boundaries, and the FRS ids it covers.
    - Do not copy the whole FRS or SDS.
  specs:
    - One delta spec per change. A small or straightforward update edits that delta. It does not add a new spec file or a new change.
    - "If the capability already exists under openspec/specs/, update that delta in place: ## ADDED Requirements for new behavior, ## MODIFIED Requirements for changed behavior, ## REMOVED Requirements for dropped behavior. Do not create a second capability folder or another ticket for a tweak."
    - Add another spec only when a capability can be implemented and verified on its own, or when one file would mix unrelated acceptance boundaries. Name that reason in the proposal.
    - Each requirement states the behavior, the FRS id, and the scenarios needed to judge it, including the failure and ownership cases that requirement needs. Do not copy the whole FRS.
  design:
    - Use the sections Approach, Files, Decisions, Transactions and security, and Open items.
    - Record the file-level approach and every decision this change depends on. Include a security, migration, or transaction choice when the change has one.
    - Do not restate the requirements.
  tasks:
    - Checklist only. One task is one verifiable slice, with the check that proves it.
    - Mark tasks that can run beside test writing as parallel.
    - Do not add tutorials, or tasks that only say "explore the codebase".

operations:
  apply:
    guidance:
      - Follow the agent launch in .claude/commands/opsx/apply.md. It starts .claude/agents/tester.md and .claude/agents/reviewer.md as separate agents.
  archive:
    guidance:
      - Read openspec/changes/<name>/review-log.md. Do not archive while a Critical or High finding is open. Warn and ask if the log is missing.
      - Keep the archive summary to a few lines.
